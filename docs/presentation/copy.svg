<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1120 650" role="img" aria-labelledby="t d"><title id="t">Original kept. Converted copy verified.</title><desc id="d">Two actual synthetic subtitle cues preserve 1.007 to 2.999 seconds and 5.120 to 7.250 seconds when converted to a numbered VTT copy. A fresh process verifies the result. Replacing it with identical bytes in a different file is held. An explicit new conversion produces another verified copy. This is actual windowless native conversion, not a new Finder interaction capture.</desc><rect width="1120" height="650" fill="#17211B"/><text x="36" y="33" font-size="12" fill="#F5F4ED" font-family="Arial, Helvetica, sans-serif">ShiftDrop / Saved-copy case</text><text x="36" y="80" font-size="36" fill="#F5F4ED" font-family="Arial, Helvetica, sans-serif">Original kept. Converted copy verified.</text><text x="36" y="200" font-size="15" fill="#F5F4ED" font-family="Arial, Helvetica, sans-serif">Original note.srt</text><path d="M180,246h904" stroke="#8B958C" stroke-width="1"/><rect data-row="0" data-cue="0" x="293.791000000" y="226" width="225.096000000" height="10" fill="#F5F4ED"/><rect data-row="0" data-cue="1" x="758.560000000" y="226" width="240.690000000" height="10" fill="#F5F4ED"/><text x="180.0" y="260" font-size="10" fill="#F5F4ED" font-family="Arial, Helvetica, sans-serif">0</text><text x="406.0" y="260" font-size="10" fill="#F5F4ED" font-family="Arial, Helvetica, sans-serif">2</text><text x="632.0" y="260" font-size="10" fill="#F5F4ED" font-family="Arial, Helvetica, sans-serif">4</text><text x="858.0" y="260" font-size="10" fill="#F5F4ED" font-family="Arial, Helvetica, sans-serif">6</text><text x="1077.0" y="260" font-size="10" fill="#F5F4ED" font-family="Arial, Helvetica, sans-serif">8</text><text x="36" y="308" font-size="15" fill="#F5F4ED" font-family="Arial, Helvetica, sans-serif">note (2).vtt</text><path d="M180,354h904" stroke="#8B958C" stroke-width="1"/><rect data-row="1" data-cue="0" x="293.791000000" y="334" width="225.096000000" height="10" fill="#D0FA6B"/><text x="293.791" y="398" font-size="14" fill="#F5F4ED" font-family="Arial, Helvetica, sans-serif">1.007–2.999s</text><rect data-row="1" data-cue="1" x="758.560000000" y="334" width="240.690000000" height="10" fill="#D0FA6B"/><text x="758.5600000000001" y="398" font-size="14" fill="#F5F4ED" font-family="Arial, Helvetica, sans-serif">5.120–7.250s</text><text x="180.0" y="368" font-size="10" fill="#F5F4ED" font-family="Arial, Helvetica, sans-serif">0</text><text x="406.0" y="368" font-size="10" fill="#F5F4ED" font-family="Arial, Helvetica, sans-serif">2</text><text x="632.0" y="368" font-size="10" fill="#F5F4ED" font-family="Arial, Helvetica, sans-serif">4</text><text x="858.0" y="368" font-size="10" fill="#F5F4ED" font-family="Arial, Helvetica, sans-serif">6</text><text x="1077.0" y="368" font-size="10" fill="#F5F4ED" font-family="Arial, Helvetica, sans-serif">8</text><text x="36" y="436" font-size="15" fill="#F5F4ED" font-family="Arial, Helvetica, sans-serif">Same linear 0–8 second scale. Both cue texts preserved.</text><text x="36" y="494" font-size="13" fill="#F5F4ED" font-family="Arial, Helvetica, sans-serif">Fresh process</text><text x="36" y="523" font-size="17" fill="#D0FA6B" font-family="Courier New, Courier, monospace">complete_verified</text><text x="391" y="494" font-size="13" fill="#F5F4ED" font-family="Arial, Helvetica, sans-serif">Same bytes, different file</text><text x="391" y="523" font-size="17" fill="#F5F4ED" font-family="Courier New, Courier, monospace">output_changed</text><text x="746" y="494" font-size="13" fill="#F5F4ED" font-family="Arial, Helvetica, sans-serif">Explicit new conversion</text><text x="746" y="523" font-size="17" fill="#D0FA6B" font-family="Courier New, Courier, monospace">complete_verified</text><text x="36" y="588" font-size="15" fill="#F5F4ED" font-family="Arial, Helvetica, sans-serif">Existing collision and original bytes remain unchanged.</text><tex