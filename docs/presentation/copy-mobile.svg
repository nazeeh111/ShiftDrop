<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 375 920" role="img" aria-labelledby="t d"><title id="t">Original kept. Converted copy verified.</title><desc id="d">Two actual synthetic subtitle cues preserve 1.007 to 2.999 seconds and 5.120 to 7.250 seconds when converted to a numbered VTT copy. A fresh process verifies the result. Replacing it with identical bytes in a different file is held. An explicit new conversion produces another verified copy. This is actual windowless native conversion, not a new Finder interaction capture.</desc><rect width="375" height="920" fill="#17211B"/><text x="22" y="33" font-size="12" fill="#F5F4ED" font-family="Arial, Helvetica, sans-serif">ShiftDrop / Saved-copy case</text><text x="22" y="80" font-size="30" fill="#F5F4ED" font-family="Arial, Helvetica, sans-serif">Original kept.</text><text x="22" y="116" font-size="30" fill="#F5F4ED" font-family="Arial, Helvetica, sans-serif">Copy verified.</text><text x="22" y="170" font-size="15" fill="#F5F4ED" font-family="Arial, Helvetica, sans-serif">Original note.srt</text><path d="M22,216h331" stroke="#8B958C" stroke-width="1"/><rect data-row="0" data-cue="0" x="63.664625000" y="196" width="82.419000000" height="10" fill="#F5F4ED"/><rect data-row="0" data-cue="1" x="233.840000000" y="196" width="88.128750000" height="10" fill="#F5F4ED"/><text x="22.0" y="230" font-size="10" fill="#F5F4ED" font-family="Arial, Helvetica, sans-serif">0</text><text x="104.75" y="230" font-size="10" fill="#F5F4ED" font-family="Arial, Helvetica, sans-serif">2</text><text x="187.5" y="230" font-size="10" fill="#F5F4ED" font-family="Arial, Helvetica, sans-serif">4</text><text x="270.25" y="230" font-size="10" fill="#F5F4ED" font-family="Arial, Helvetica, sans-serif">6</text><text x="346.0" y="230" font-size="10" fill="#F5F4ED" font-family="Arial, Helvetica, sans-serif">8</text><text x="22" y="296" font-size="15" fill="#F5F4ED" font-family="Arial, Helvetica, sans-serif">note (2).vtt</text><path d="M22,342h331" stroke="#8B958C" stroke-width="1"/><rect data-row="1" data-cue="0" x="63.664625000" y="322" width="82.419000000" height="10" fill="#D0FA6B"/><text x="63.664625" y="386" font-size="10" fill="#F5F4ED" font-family="Arial, Helvetica, sans-serif">1.007–2.999s</text><rect data-row="1" data-cue="1" x="233.840000000" y="322" width="88.128750000" height="10" fill="#D0FA6B"/><text x="233.84" y="386" font-size="10" fill="#F5F4ED" font-family="Arial, Helvetica, sans-serif">5.120–7.250s</text><text x="22.0" y="356" font-size="10" fill="#F5F4ED" font-family="Arial, Helvetica, sans-serif">0</text><text x="104.75" y="356" font-size="10" fill="#F5F4ED" font-family="Arial, Helvetica, sans-serif">2</text><text x="187.5" y="356" font-size="10" fill="#F5F4ED" font-family="Arial, Helvetica, sans-serif">4</text><text x="270.25" y="356" font-size="10" fill="#F5F4ED" font-family="Arial, Helvetica, sans-serif">6</text><text x="346.0" y="356" font-size="10" fill="#F5F4ED" font-family="Arial, Helvetica, sans-serif">8</text><text x="22" y="420" font-size="11" fill="#F5F4ED" font-family="Arial, Helvetica, sans-serif">Same linear 0–8 second scale. Both cue texts preserved.</text><text x="22" y="498" font-size="13" fill="#F5F4ED" font-family="Arial, Helvetica, sans-serif">Fresh process</text><text x="22" y="527" font-size="17" fill="#D0FA6B" font-family="Courier New, Courier, monospace">complete_verified</text><text x="22" y="607" font-size="13" fill="#F5F4ED" font-family="Arial, Helvetica, sans-serif">Same bytes, different file</text><text x="22" y="636" font-size="17" fill="#F5F4ED" font-family="Courier New, Courier, monospace">output_changed</text><text x="22" y="716" font-size="13" fill="#F5F4ED" font-family="Arial, Helvetica, sans-serif">Explicit new conversion</text><text x="22" y="745" font-size="17" fill="#D0FA6B" font-family="Courier New, Courier, monospace">complete_verified</text><text x="22" y="872" font-size="11" fill="#F5F4ED" font-family="Arial, Helvetica, sans-serif">Existing collision and original bytes remain unchanged.</text><text x="22" y="898" font-size="11" fill="#F5F4ED" font-family="Arial, Helvetica, sans-serif">Actual packaged CLI. Native drag and picker not retested.</text></svg>