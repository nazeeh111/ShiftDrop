name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test engines and utility
        env:
          SHIFTDROP_TEST_ROOT: ${{ runner.temp }}/shiftdrop-test-fixtures
        run: |
          mkdir -p "$SHIFTDROP_TEST_ROOT"
          swift test --scratch-path "$RUNNER_TEMP/shiftdrop-test-build"
      - name: Package app
        run: bash scripts/package.sh
      - name: Exercise packaged batch recovery
        run: bash scripts/test-batch-resume.sh dist/ShiftDrop.app/Contents/MacOS/ShiftDrop
      - name: Upload app archive
        uses: actions/upload-artifact@v4
        with:
          name: ShiftDrop-macOS
          path: dist/ShiftDrop-*-macOS.zip
          if-no-files-found: error
