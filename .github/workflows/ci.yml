name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test engines and utility
        env:
          SHIFTDROP_TEST_ROOT: ${{ runner.temp }}/shiftdrop-test-fixtures
        run: |
          mkdir -p "$SHIFTDROP_TEST_ROOT"
          swift test --scratch-path "$RUNNER_TEMP/shiftdrop-test-build"
      - name: Package app
        run: bash scripts/package.sh
      - name: Verify and exercise the distributable archive
        run: |
          extracted="$(mktemp -d "$RUNNER_TEMP/shiftdrop-archive.XXXXXX")"
          ditto -x -k dist/ShiftDrop-*-macOS.zip "$extracted"
          app="$extracted/ShiftDrop.app"
          cmp LICENSE "$app/Contents/Resources/LICENSE"
          codesign --verify --deep --strict "$app"
          bash scripts/test-batch-resume.sh "$app/Contents/MacOS/ShiftDrop"
      - name: Upload app archive
        uses: actions/upload-artifact@v4
        with:
          name: ShiftDrop-macOS
          path: dist/ShiftDrop-*-macOS.zip
          if-no-files-found: error
